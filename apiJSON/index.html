<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios y Posts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 20px;
            text-align: center;
        }

        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        #posts {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .post {
            background-color: white;
            width: 60%;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h3 {
            color: #333;
        }

        button {
            padding: 10px 15px;
            margin-top: 10px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            align-items: center;
            justify-items: center;
        }

        #ver {
            color: blue;
            background-color: aquamarine;
            align-items: center;
        }

        #ocultar {
            color: red;
            background-color: azure;
            align-items: center;
        }
    </style>
</head>

<body>
    <select name="users" id="users"></select>
    <div id="posts"></div>
    <button type="button" id="agregar">Agregar Post</button>
    <div id="modal"
        style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.3);">
        <h2>Agregar Nuevo Post</h2>
        <form id="postForm">
            <label for="title">Título:</label>
            <input type="text" id="title" required>
            <br>
            <label for="body">Cuerpo:</label>
            <textarea id="body" required></textarea>
            <br>
            <button type="button" id="publicar">Publicar</button>
            <button type="button" id="cerrarModal">Cancelar</button>
        </form>
    </div>

</body>
<script>
    const url = `https://jsonplaceholder.typicode.com/users`;
    const select = document.getElementById("users");
    const div = document.getElementById("posts");
    const agregar = document.getElementById("agregar");
    const modal = document.getElementById("modal");
    const cerrarModal = document.getElementById("cerrarModal");
    const postForm = document.getElementById("postForm");
    const publicar = document.getElementById("publicar");

    fetch(url)
        .then(response => response.json())
        .then(users => {
            for (let i = 0; i < users.length; i++) {
                select.innerHTML += `<option value="${users[i].id}">${users[i].username}</option>`;
            }
        });

    select.addEventListener("change", () => {
        let selected = select.value;
        const url = `https://jsonplaceholder.typicode.com/posts?userId=${selected}`;
        fetch(url)
            .then(response => response.json())
            .then(posts => {
                div.innerHTML = '';
                for (let i = 0; i < posts.length; i++) {
                    div.innerHTML += `<div class="post" id="post${posts[i].id}">
                        <h3>${posts[i].title}</h3>
                        <p>${posts[i].body}</p>
                        <button type="button" class="verCom" id="ver" onclick="mostrarComentarios(${posts[i].id})">Ver comentarios</button>
                        <button type="button" class="oculCom" id="ocultar" onclick="ocultarComentarios(${posts[i].id})" style="display:none;">Ocultar comentarios</button>
                        <button type="button" id="eliminar" onclick="eliminarPost(${posts[i].id})">Eliminar post</button>
                        <div class="comments" id="comments-${posts[i].id}" style="display:none;"></div>
                    </div>`;
                    console.log(posts[i].id);
                }
            });
    });

    function mostrarComentarios(numero) {

        let commentDiv = document.getElementById('comments-' + numero);
        commentDiv.style.display = 'block';
        const url = `https://jsonplaceholder.typicode.com/comments?postId=${numero}`;

        fetch(url)
            .then(response => response.json())
            .then(comentarios => {
                commentDiv.innerHTML = '';
                for (let i = 0; i < comentarios.length; i++) {
                    commentDiv.innerHTML += `<div>
                                    <h5>${comentarios[i].email}</h5>
                                    <p>${comentarios[i].body}</p></div>`;
                }
            });

        let btnDel = document.querySelector(`.oculCom[onclick="ocultarComentarios(${numero})"]`);
        btnDel.style.display = 'block';
        let btnAdd = document.querySelector(`.verCom[onclick="mostrarComentarios(${numero})"]`);
        btnAdd.style.display = 'none';
    }

    function ocultarComentarios(numero) {
        let commentDiv = document.getElementById('comments-' + numero);
        commentDiv.style.display = 'none';

        let btnDel = document.querySelector(`.oculCom[onclick="ocultarComentarios(${numero})"]`);
        btnDel.style.display = 'none';

        let btnAdd = document.querySelector(`.verCom[onclick="mostrarComentarios(${numero})"]`);
        btnAdd.style.display = 'block';
    }

    function eliminarPost(idPost) {
        const url = `https://jsonplaceholder.typicode.com/posts/${idPost}`;

        fetch(url, { method: 'DELETE' })
            .then(response => response.json())
            .then(post => {
                let divEliminado = document.getElementById(`post${idPost}`);
                divEliminado.remove();
            });
    }

    agregar.addEventListener('click', () => {
        modal.style.display = 'block';
    });

    cerrarModal.addEventListener('click', () => {
        modal.style.display = 'none';
    });

    publicar.addEventListener('click', () => {
    let selected = select.value;
    let titulo = document.getElementById("title").value;
    let body = document.getElementById("body").value;

    const url = `https://jsonplaceholder.typicode.com/posts`;

    fetch(url, {
        method: 'POST',
        body: JSON.stringify({ userId: selected, title: titulo, body: body }),
        headers: {
            'Content-type': 'application/json; charset=UTF-8',
        },
    })
    .then(response => response.json())
    .then(post => {
        div.innerHTML += `<div class="post" id="post${post.id}">
            <h3>${post.title}</h3>
            <p>${post.body}</p>
            <button type="button" class="verCom" id="ver" onclick="mostrarComentarios(${post.id})">Ver comentarios</button>
            <button type="button" class="oculCom" id="ocultar" onclick="ocultarComentarios(${post.id})" style="display:none;">Ocultar comentarios</button>
            <button type="button" id="eliminar" onclick="eliminarPost(${post.id})">Eliminar post</button>
            <div class="comments" id="comments-${post.id}" style="display:none;"></div>
        </div>`;

        postForm.reset();
        modal.style.display = 'none';
    });
});

</script>

</html>
