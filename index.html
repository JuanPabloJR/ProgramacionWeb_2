<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Productos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        .container {
            width: 50%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 80%;
        }

        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Gestión de Inventario</h1>
            <input type="number" id="codigo" placeholder="Código" required>
            <input type="text" id="nombre" placeholder="Nombre" required>
        <button type="button" id="agregar">Agregar Producto</button>
        <button type="button" id="listar">Listar Productos</button>
        <button type="button" id="buscar">Buscar Producto</button>
        <button type="button" id="eliminar">Eliminar Producto</button>
        <div id="output"></div>
    </div>
</body>
<script src="app.js"></script>
</html>
